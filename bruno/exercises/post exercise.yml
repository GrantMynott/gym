info:
  name: post exercise
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/exercise"
  body:
    type: json
    data: |-
      {
        "name": "Pullups",
        "muscles": [
          "Lats",
          "Biceps"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
